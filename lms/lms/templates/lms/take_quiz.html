{% extends 'base.html' %}
{% block content %}
<h3>{{ quiz.title }}</h3>
<form method="post">{% csrf_token %}
  {% for q in questions %}
  <div class="card mb-3"><div class="card-body">
    <p class="fw-semibold">{{ forloop.counter }}. {{ q.text }}</p>
    {% for c in q.choices.all %}
    <div class="form-check"><input class="form-check-input" type="radio" name="q{{ q.id }}" id="c{{ c.id }}" value="{{ c.id }}" required>
      <label class="form-check-label" for="c{{ c.id }}">{{ c.text }}</label></div>
    {% endfor %}
  </div></div>
  {% endfor %}
  <button class="btn btn-primary">Submit quiz</button>
  <a class="btn btn-link" href="{% url 'course_detail' quiz.course.pk %}">Cancel</a>
</form>
{% endblock %}
