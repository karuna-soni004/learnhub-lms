{% extends 'base.html' %}
{% block content %}
<div class="card"><div class="card-body">
  <h5>Delete "{{ course.title }}"?</h5>
  <p class="text-muted">This removes all its lessons, quizzes and submissions.</p>
  <form method="post">{% csrf_token %}<button class="btn btn-danger">Yes, delete</button>
  <a class="btn btn-link" href="{% url 'course_detail' course.pk %}">Cancel</a></form>
</div></div>
{% endblock %}
