{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7"><div class="card"><div class="card-body p-4">
  <h4 class="mb-3">{{ title }}</h4>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}
      {% if f.help_text %}<div class="form-text">{{ f.help_text }}</div>{% endif %}
      {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
    <button class="btn btn-primary">Save</button>
    {% if course %}<a class="btn btn-link" href="{% url 'course_detail' course.pk %}">Cancel</a>{% endif %}
  </form>
</div></div></div></div>
<script>document.querySelectorAll('input:not([type=hidden]):not([type=checkbox]),textarea,select').forEach(i=>{i.classList.add(i.tagName==='SELECT'?'form-select':'form-control')});</script>
{% endblock %}
