{% extends 'base.html' %}
{% block content %}
<nav class="small mb-2"><a href="{% url 'course_detail' course.pk %}">&larr; {{ course.title }}</a></nav>
<h4>Enrolled students</h4>
<table class="table table-striped bg-white">
  <thead><tr><th>Student</th><th>Enrolled</th><th style="width:35%">Progress</th></tr></thead>
  <tbody>
  {% for r in rows %}
    <tr><td>{{ r.student.username }}</td><td>{{ r.enrolled_at|date:"d M Y" }}</td>
      <td><div class="progress"><div class="progress-bar bg-success" style="width: {{ r.progress }}%">{{ r.progress }}%</div></div></td></tr>
  {% empty %}<tr><td colspan="3" class="text-muted">No students enrolled yet.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
