{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card"><div class="card-body p-4">
  <h4 class="mb-3">Login</h4>
  <form method="post">{% csrf_token %}
    {% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}{% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
    {% for e in form.non_field_errors %}<div class="text-danger small mb-2">{{ e }}</div>{% endfor %}
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3 small">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</div></div></div></div>
<script>document.querySelectorAll('input').forEach(i=>{if(i.type!=='hidden')i.classList.add('form-control')});</script>
{% endblock %}
